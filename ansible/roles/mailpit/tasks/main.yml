---
- name: Get latest Mailpit release if not defined
  uri:
    url: https://api.github.com/repos/axllent/mailpit/releases/latest
    return_content: yes
  when: mailpit_version == ""
  register: mailpit_latest_release

- name: Set mailpit version from GitHub if not provided
  set_fact:
    mailpit_version: "{{ mailpit_latest_release.json.tag_name }}"
  when: mailpit_version == ""

- name: Check current Mailpit version
  command: "{{ mailpit_install_dir }}/mailpit version"
  register: mailpit_current
  changed_when: false
  failed_when: false

- name: Set Mailpit architecture suffix
  set_fact:
    mailpit_arch: "{{ mailpit_arch_map[ansible_facts['architecture']] | default('amd64') }}"
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Set Mailpit archive URL
  set_fact:
    mailpit_download_url: "https://github.com/axllent/mailpit/releases/download/{{ mailpit_version }}/mailpit-linux-{{ mailpit_arch }}.tar.gz"
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Create temp directory for Mailpit download
  tempfile:
    state: directory
    suffix: mailpit
  register: mailpit_tmp
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Download Mailpit tarball
  get_url:
    url: "{{ mailpit_download_url }}"
    dest: "{{ mailpit_tmp.path }}/mailpit.tar.gz"
    mode: '0644'
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Extract Mailpit binary
  unarchive:
    src: "{{ mailpit_tmp.path }}/mailpit.tar.gz"
    dest: "{{ mailpit_tmp.path }}"
    remote_src: yes
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Install Mailpit binary
  copy:
    src: "{{ mailpit_tmp.path }}/mailpit"
    dest: "{{ mailpit_install_dir }}/mailpit"
    mode: '0755'
    remote_src: yes
  notify: restart mailpit
  when: mailpit_version not in (mailpit_current.stdout | default(''))

- name: Clean up temp directory
  file:
    path: "{{ mailpit_tmp.path }}"
    state: absent
  when: mailpit_tmp.path is defined

- name: Deploy systemd service for Mailpit
  template:
    src: mailpit.service.j2
    dest: /etc/systemd/system/mailpit.service
    owner: root
    group: root
    mode: '0644'
  notify: restart mailpit

- name: Enable and start Mailpit
  systemd:
    name: mailpit
    enabled: yes
    state: started
