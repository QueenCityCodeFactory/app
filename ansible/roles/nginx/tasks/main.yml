---
- name: Add ondrej/nginx PPA (with retry logic)
  shell: "add-apt-repository -y ppa:ondrej/nginx"
  register: nginx_ppa_result
  retries: 3
  delay: 30
  until: nginx_ppa_result is succeeded
  failed_when: false
  become: true
  become_user: root

- name: Warn if PPA addition failed
  debug:
    msg: |
      WARNING: Could not add ondrej/nginx PPA (Launchpad may be down).
      Falling back to default Ubuntu nginx package.
  when: nginx_ppa_result is failed

- name: Apt Update
  apt:
    update_cache: yes

- name: Install Nginx
  apt:
    pkg:
      - nginx
    state: present

- name: Sites Available Configs
  template:
    src: "sites-available/{{ item.config }}.j2"
    dest: "/etc/nginx/sites-available/{{ item.server_name }}.conf"
    owner: root
    group: root
    mode: 0644
    backup: yes
  with_items: "{{ nginx_configurations }}"

- name: Create the Sites Enabled Symlinks
  file:
    src: "/etc/nginx/sites-available/{{ item.server_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item.server_name }}.conf"
    state: link
  with_items: "{{ nginx_configurations }}"

- name: Remove default site symlink
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy nginx.conf
  template:
    src: "nginx.conf"
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
    backup: yes
  notify: restart and enable nginx
