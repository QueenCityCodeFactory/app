---
- name: Install WkHtmlToPdf Dependencies
  apt:
    pkg:
      - libxrender1
      - libfontconfig1
      - libx11-dev
      - libjpeg62
      - libxtst6
      - fontconfig
      - xfonts-75dpi
      - xfonts-base
    state: present

- name: 'Download WkHtmlToPdf arm64'
  get_url:
    url: https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6-1/wkhtmltox_0.12.6-1.focal_arm64.deb
    dest: /root/wkhtmltopdf.deb
    force: false
    validate_certs: no
  when: ansible_facts["architecture"] == 'aarch64'

- name: 'Download WkHtmlToPdf x86_64'
  get_url:
    url: https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6-1/wkhtmltox_0.12.6-1.focal_amd64.deb
    dest: /root/wkhtmltopdf.deb
    force: false
    validate_certs: no
  when: ansible_facts["architecture"] == 'x86_64'

- name: 'Install WkHtmlToPdf'
  command: dpkg -i /root/wkhtmltopdf.deb