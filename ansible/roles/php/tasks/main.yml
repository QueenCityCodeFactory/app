---
- name: Add PPA
  apt_repository:
    repo: "ppa:ondrej/php"

- name: Apt Update
  apt:
    update_cache: yes

- name: Install PHP and Dependencies
  apt:
    pkg:
      - php8.1-fpm
      - php8.1-cli
      - php8.1-mysql
      - php8.1-intl
      - php8.1-ldap
      - php8.1-sqlite3
      - php8.1-curl
      - php8.1-xsl
      - php8.1-imap
      - php8.1-imagick
      - php8.1-memcached
      - php8.1-zip
      - php8.1-mbstring
      - php-json
      - php8.1-soap
      - php8.1-xml
      - php8.1-gd
    state: present

- name: Install Composer
  get_url:
    url: https://getcomposer.org/composer-stable.phar
    dest: /usr/local/bin/composer
    mode: 0755
    validate_certs: no

- name: Configure php8.1-fpm pool.
  lineinfile:
    dest: "/etc/php/8.1/fpm/pool.d/www.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^listen.?=.+$"
      line: "listen = /run/php/php8.1-fpm.sock"
    - regexp: "^pm.max_children.?=.+$"
      line: "pm.max_children = 120"
    - regexp: "^pm.start_servers.?=.+$"
      line: "pm.start_servers = 10"
    - regexp: "^pm.min_spare_servers.?=.+$"
      line: "pm.min_spare_servers = 10"
    - regexp: "^pm.max_spare_servers.?=.+$"
      line: "pm.max_spare_servers = 20"
    - regexp: "^;pm.max_requests.?=.+$"
      line: "pm.max_requests = 500"

- name: Configure php8.1 php.ini
  lineinfile:
    dest: "/etc/php/8.1/fpm/php.ini"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^post_max_size.?=.+$"
      line: "post_max_size = 108M"
    - regexp: "^upload_max_filesize.?=.+$"
      line: "upload_max_filesize = 100M"
  notify: restart php8.1-fpm
