---
- name: Install chrony
  apt:
    name: chrony
    state: present
    update_cache: yes

- name: Deploy chrony config
  template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart chrony

- name: Enable and start chrony
  systemd:
    name: chrony
    enabled: yes
    state: started

- name: Set timezone
  command: timedatectl set-timezone {{ chrony_timezone }}
  changed_when: false

- name: Enable NTP sync via timedatectl
  command: timedatectl set-ntp true
  changed_when: false
  failed_when: false