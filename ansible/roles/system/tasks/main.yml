---
- name: Update and dist-upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install Essential Packages
  apt:
    pkg:
      - acl
      - build-essential
      - ca-certificates
      - curl
      - ghostscript
      - git
      - gnupg
      - htop
      - imagemagick
      - jq
      - lsof
      - mysql-client
      - net-tools
      - openssl
      - python3-pymysql
      - rsync
      - run-one
      - software-properties-common
      - ssl-cert
      - unzip
      - vim
      - wget
      - zip
    state: present

- name: make a symbolic link for www
  file:
    src: /var/www/
    dest: /www
    state: link
