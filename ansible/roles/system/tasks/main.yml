---
- name: Update apt
  apt:
    update_cache: yes
    cache_valid_time: 3600
- name: Upgrade apt
  apt:
    upgrade: full
- name: Make a general dist-upgrade
  apt:
    upgrade: dist

- name: Install Essential Packages
  apt:
    pkg:
      - curl
      - software-properties-common
      - htop
      - wget
      - ghostscript
      - imagemagick
      - vim
      - build-essential
      - rsync
      - git-core
      - openssl
      - unzip
      - certbot
      - python3-certbot-nginx
      - ssl-cert
      - run-one
    state: present

- name: make a symbolic link for www
  file:
    src: /var/www/
    dest: /www
    state: link
