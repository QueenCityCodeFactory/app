---
- name: Update and dist-upgrade apt packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Install Essential Packages
  apt:
    pkg:
      - curl
      - software-properties-common
      - htop
      - wget
      - ghostscript
      - imagemagick
      - vim
      - build-essential
      - rsync
      - git-core
      - openssl
      - unzip
      - ssl-cert
      - run-one
    state: present

- name: make a symbolic link for www
  file:
    src: /var/www/
    dest: /www
    state: link
