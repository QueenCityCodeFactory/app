---
- name: Build the Development Environment
  hosts: development
  module_defaults:
    apt:
      force_apt_get: yes
  user: ubuntu
  become: true
  become_user: root
  vars:
    become_alternate_user: "ubuntu"

  pre_tasks:
    - name: Copy all.yml.example to all.yml on host if it does not exist
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inventories/development/group_vars/all.yml.example"
        dest: "{{ playbook_dir }}/../inventories/development/group_vars/all.yml"
        force: no
      delegate_to: localhost
      become: false

    - name: Reload variables after copying defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/development/group_vars/all.yml"

    - name: Ensure all.yml exists on the VM as well
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../inventories/development/group_vars/all.yml"
        dest: "{{ app_path }}/ansible/inventories/development/group_vars/all.yml"
        force: no
      become: true
      become_user: "{{ become_alternate_user }}"

    - name: Check if this is the initial provision
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../.innkeeper/state.built"
      delegate_to: localhost
      become: false
      register: state_built

    - name: Validate required variables are defined
      ansible.builtin.assert:
        that:
          - app_name is defined and app_name != "CHANGEME"
          - app_path is defined and app_path != "/var/www/CHANGEME"
          - app_domain is defined and app_domain != "CHANGEME.test"
          - db_name is defined and db_name != "CHANGEME"
          - db_user is defined and db_user != "CHANGEME"
          - db_password is defined and db_password != "CHANGEME"
          - ssl_domain is defined and ssl_domain != "CHANGEME.test"
        fail_msg: |
          ❌ Required variables are missing or still set to placeholder values!

          Copy the example config and update all CHANGEME values:
            cp ansible/inventories/development/group_vars/all.yml.example \
               ansible/inventories/development/group_vars/all.yml

          Then edit all.yml with your project-specific values.

  roles:
    - {role: "zsh", tags: "zsh"}
    - {role: "system", tags: "system"}
    - {role: "chrony", tags: "chrony"}
    - {role: "php", tags: "php"}
    - {role: "ssl", tags: "ssl"}
    - {role: "nginx", tags: "nginx"}
    - {role: "mysql_server", tags: "mysql_server"}
    - {role: "memcached", tags: "memcached"}
    - {role: "nodejs", tags: "nodejs"}
    - {role: "crontab", tags: "crontab"}
    - {role: "mailpit", tags: "mailpit"}

  tasks:
    - name: make a symbolic link for application crontab file
      file:
        src: "{{ app_path }}/cron.d/development"
        dest: "/etc/cron.d/{{ app_name }}"
        state: link

    - name: Create CakePHP dev config from default
      copy:
        src: "{{ app_path }}/config/app_local.example.php"
        dest: "{{ app_path }}/config/app_local.php"
        remote_src: yes
        force: no
      become: true
      become_user: "{{ become_alternate_user }}"
      when: not state_built.stat.exists

    - name: install composer dependencies
      shell: "echo Y | composer install"
      args:
        chdir: "{{ app_path }}"
      become: true
      become_user: "{{ become_alternate_user }}"
      register: composer_result

    - name: Set writable permissions on tmp and logs directories
      file:
        path: "{{ app_path }}/{{ item }}"
        state: directory
        mode: "0777"
        owner: "{{ become_alternate_user }}"
        group: www-data
        recurse: no
      loop:
        - logs
        - tmp
        - tmp/cache
        - tmp/cache/models
        - tmp/cache/persistent
        - tmp/cache/views
        - tmp/sessions
        - tmp/tests
      when: composer_result is succeeded

    - name: Set package.json name from app_name
      replace:
        path: "{{ app_path }}/package.json"
        regexp: '"name": ".*"'
        replace: '"name": "{{ app_name }}"'
      when: not state_built.stat.exists

    - name: Install node packages for application
      shell: "source ~/.nvm/nvm.sh && npm install"
      become: true
      become_user: "{{ become_alternate_user }}"
      args:
        executable: /bin/bash
        chdir: "{{ app_path }}"

    - name: Build frontend assets with gulp
      shell: "source ~/.nvm/nvm.sh && gulp"
      become: true
      become_user: "{{ become_alternate_user }}"
      args:
        executable: /bin/bash
        chdir: "{{ app_path }}"
      when: not state_built.stat.exists

    - name: Create /var/files/
      file:
        path: "/var/files/"
        state: directory
        owner: www-data
        group: www-data
        mode: 0755

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart php-fpm
      systemd:
        name: "php{{ php_version }}-fpm"
        state: restarted

    - name: Create MySQL application user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL,GRANT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: mysql_server_local | default(true)

    - name: Create the MySQL database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_general_ci
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: mysql_server_local | default(true)

    - name: Run app migrations on initial provision
      command: "{{ app_path }}/bin/cake migrations migrate -vvvv"
      when: not state_built.stat.exists

  post_tasks:
    - name: Check if innkeeper is available
      ansible.builtin.command: which innkeeper
      delegate_to: localhost
      become: false
      register: innkeeper_check
      changed_when: false
      failed_when: false

    - name: Sync VM files back to host (vendor, node_modules, app_local.php, etc.)
      ansible.builtin.command:
        cmd: innkeeper sync from-vm --all
        chdir: "{{ playbook_dir }}/../.."
      delegate_to: localhost
      become: false
      when: not state_built.stat.exists and innkeeper_check.rc == 0
